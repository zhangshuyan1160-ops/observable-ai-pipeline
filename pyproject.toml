[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "observable-ai-pipeline"
version = "0.1.0"
description = "Recoverable animation pipeline with PostgreSQL leases and observable attempts"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.27,<1", "ruff>=0.9,<1"]
local = ["pgserver==0.1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeline = ["storage/*.sql", "web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
