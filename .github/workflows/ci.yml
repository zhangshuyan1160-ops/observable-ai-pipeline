name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.lock'
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend/create-intent.test.mjs
      - run: pytest -q --basetemp=.local/pytest --junitxml=.local/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: .local/tests.xml
